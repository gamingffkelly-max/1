name: Long Video
on:
  schedule:
    - cron: "0 18 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
concurrency:
  group: video-long
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      OLLAMA_MODEL: qwen2.5:7b
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
      - name: Python packages
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            voice
          key: models-v1
      - name: Piper voice
        run: |
          mkdir -p voice
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high
          [ -f voice/en_US-ryan-high.onnx ] || curl -L -o voice/en_US-ryan-high.onnx $B/en_US-ryan-high.onnx
          [ -f voice/en_US-ryan-high.onnx.json ] || curl -L -o voice/en_US-ryan-high.onnx.json $B/en_US-ryan-high.onnx.json
      - name: Ollama (local LLM)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          for i in $(seq 30); do curl -s localhost:11434 >/dev/null && break; sleep 2; done || true
          curl -s localhost:11434 >/dev/null || (nohup ollama serve >/tmp/ollama.log 2>&1 & sleep 10)
          ollama pull $OLLAMA_MODEL
      - name: Create and publish video
        run: python main.py long
      - name: Save used-topics state
        if: success()
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || { git commit -m "update state"; for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done; }
